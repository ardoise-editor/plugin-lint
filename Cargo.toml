[package]
name = "ardoise-lint"
version = "1.0.1"
edition = "2021"
rust-version = "1.90"
publish = false
description = "The Lint plugin of Ardoise"
license = "MIT"

[[bin]]
name = "lint"
path = "src/main.rs"

[dependencies]
ardoise-plugin = { path = "../plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["rt", "process", "io-util", "time", "macros"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
